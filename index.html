<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS GAME</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <img src="assets/uwp5065044.jpeg" alt="BG IMAGE" id="bg-img">
    <div id="main-div">
        <h1 id="heading">ROCK PAPER SCISSORS GAME</h1>
        <h1 id="sub-heading">Choose your move!</h1>
        <div id="controls">
            <button id="rock">👊</button>
            <button id="paper">🖐️</button>
            <button id="scissor">✌️</button>
        </div>
        <h1 id="result"></h1>
        <h1 id="score">|Your Score: 0 | Computer Score: 0|</h1>
    </div>
    <div id="footer">
        <h1>Made With 💖 By M Arif Manzoor</h1>
    </div>
</body>
</html>
